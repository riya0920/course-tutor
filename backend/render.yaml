# Render blueprint. Push to GitHub, then "New > Blueprint" and point at this repo.
services:
  - type: web
    name: course-tutor-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      # Provider auto-detects: set ANTHROPIC_API_KEY for Claude (the documented
      # primary), or GEMINI_API_KEY for Gemini. Leave both empty for mock mode.
      - key: LLM_PROVIDER
        value: auto
      - key: ANTHROPIC_API_KEY
        sync: false          # set in the Render dashboard (secret)
      - key: TUTOR_MODEL
        value: claude-opus-5
      - key: GEMINI_API_KEY
        sync: false          # set in the Render dashboard (secret)
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GUARDRAILS_ENABLED
        value: "true"
      - key: CORS_ORIGINS
        sync: false          # set to your Vercel URL, e.g. https://course-tutor.vercel.app
    # No persistent disk: keeps the service on Render's FREE tier (disks require
    # a paid instance). Storage is ephemeral — the sample course re-seeds on
    # startup; uploads/quiz history reset on a cold start, which matches the
    # documented single-session limitation. To make data durable later, add a
    # `disk:` block here and bump `plan` to `starter` (~$7/mo).
